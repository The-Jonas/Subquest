# Runs every automated test on each push and pull request:
# the core's portable C++ tests, the Rust app tests and the frontend tests.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build -j
      - name: Test
        run: ctest --test-dir core/build --output-on-failure

  core-windows:
    name: Core (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S core -B core/build
          cmake --build core/build --config Release
      - name: Test
        run: ctest --test-dir core/build -C Release --output-on-failure

  app:
    name: App (Rust + frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend packages
        working-directory: app
        run: npm ci

      - name: Frontend tests
        working-directory: app
        run: npm test

      - name: Type check
        working-directory: app
        run: npm run check

      # The Rust build embeds the built frontend and expects the core DLL as a
      # bundle resource. The DLL is only loaded at run time, so the tests just
      # need the file to exist.
      - name: Build frontend and placeholder DLL
        working-directory: app
        run: |
          npm run build
          mkdir -p src-tauri/bin
          touch src-tauri/bin/subquest_core.dll

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test

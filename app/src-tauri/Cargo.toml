[package]
name = "subquest"
version = "0.1.0"
description = "Real-time game translator"
authors = ["The-Jonas"]
license = "GPL-3.0-only"
repository = "https://github.com/The-Jonas/Subquest"
edition = "2021"
rust-version = "1.77"

[lib]
# Nome diferente do binário para evitar conflito no Windows (padrão do Tauri v2)
name = "subquest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
base64 = "0.22"
futures-util = "0.3.34"
png = "0.18"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
